<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Learnix Research Lab</title>
<meta name="description" content="Contact Learnix Research Lab for questions and research collaboration.">
<meta property="og:title" content="Contact Us | Learnix Research Lab">
<meta property="og:description" content="Contact Learnix Research Lab for questions and research collaboration.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<header class="page-hero"><div class="wrap"><h1>Contact us</h1><p>Questions, collaboration ideas and visits are welcome.</p></div></header>
<section class="block"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px">
<div><h2>Send a message</h2><form class="form" id="contact"><label>Name<input name="name" required maxlength="100"></label><label>Email<input name="email" type="email" required maxlength="120"></label><label>Subject<select name="subject"><option>General question</option><option>Research collaboration</option><option>Media</option></select></label><label>Message<textarea name="message" rows="5" required maxlength="3000"></textarea></label><button class="btn" type="submit">Send message</button><div id="out" role="status"></div></form></div>
<div id="info"></div></div></section>
<div id="site-footer"></div>
<script type="module" src="js/common.js"></script>
<script type="module" src="js/forms.js"></script>
</body>
</html>
